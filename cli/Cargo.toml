[package]
name = "vault-cli"
version = "0.2.0"
edition = "2024"
publish = false
license = "ISC"

[dependencies]
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "7eb04634bfbae5350c1808efc7e34c4efa7f93af" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "7eb04634bfbae5350c1808efc7e34c4efa7f93af" }
kaspa-consensus-core = "2.1.0"
kaspa-txscript = "2.1.0"
kaspa-addresses = "2.1.0"
kaspa-wrpc-client = "2.1.0"
kaspa-rpc-core = "2.1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
blake2b_simd = "1"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
rpassword = "7"
zeroize = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1.5.1"
base64 = "0.22"
tiny_http = "0.12"
ureq = "2"
url = "2.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
kaspa-bip32 = "2.1.0"
hmac = "0.12"
sha1 = "0.10"

# Windows : liste d'accès restreinte à l'utilisateur courant pour les fichiers sensibles (src/prive.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"

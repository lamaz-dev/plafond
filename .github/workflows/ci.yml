# Intégration continue publique : aucun secret, aucun accès en écriture.
# Elle prouve à chaque envoi que le bytecode se reconstruit à l'identique depuis le code source
# et que tous les tests (contrats, outil, fuzzing d'état) passent.
name: Tests et empreintes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # campagne longue de fuzzing, chaque lundi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Vulnérabilités connues des dépendances (cargo audit, base RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-v0
      - name: Installer cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked
      - name: Audit (Cargo.lock figé ; exceptions justifiées dans cli/.cargo/audit.toml)
        run: cd cli && cargo audit
  outil:
    name: Outil, fuzzing d'état et empreintes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ci-${{ hashFiles('cli/Cargo.lock', 'cli/rust-toolchain.toml') }}
      - name: Compiler (dépendances figées)
        run: cd cli && cargo build --release --locked
      - name: Empreintes reproductibles
        run: |
          cd cli && ./target/release/vault-cli empreintes > /tmp/empreintes.txt
          diff -u ../contracts/EMPREINTES.txt /tmp/empreintes.txt
      - name: Preuve de la borne de perte (verify-proof.sh)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then export FUZZ_CASES=2000; fi
          ./verify-proof.sh
      - name: Tests de l'outil, dont fuzzing d'état (proptest)
        run: cd cli && cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK Python (tests contre un faux routeur)
        run: cd sdk/python && python3 -m unittest discover -s tests -v
      - name: Relais vers Kaspa x402 (juge et bout en bout, hors ligne)
        run: |
          cd tests/juge-kaspa-x402 && npm ci --ignore-scripts
          ../../cli/target/release/vault-cli relais-exemple | node juge.mjs
          node bout-en-bout.mjs ../../cli/target/release/vault-cli

  contrats:
    name: Tests des contrats sur le compilateur SilverScript figé
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Récupérer SilverScript à la révision figée
        run: |
          git clone https://github.com/kaspanet/silverscript /tmp/silverscript
          cd /tmp/silverscript && git checkout 7eb04634bfbae5350c1808efc7e34c4efa7f93af
      - name: Lancer les tests des contrats
        run: |
          cp tests/*.rs contracts/*.sil /tmp/silverscript/silverscript-lang/tests/
          cd /tmp/silverscript && cargo test --release -p silverscript-lang --test agent_budget_tests --test delivery_escrow_tests --test ardoise_tests --test coeur_tests
